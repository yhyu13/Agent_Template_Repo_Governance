# agent-gate 配置：把治理面路径、共享正本目录、默认 issue、分支/工作树前缀抽出来，
# 使 pr-grade.sh / new-slice.sh / check-refs.py 与具体项目无关。
#
# 改这个文件不需要改脚本；改了它，脚本的判定随之改变。
#
# 安全约束：本文件自身也在治理面清单里（GOV_PATHS_RE 的内置默认含 .agent-gate.conf），
# 因为它能覆盖治理面清单——治理判据的存放位置必须比它保护的对象更受保护，
# 否则「改配置把红级触发器删掉」会是一条一步绕过的后门。

# 1) 治理面文件：改动即视为红级（FR-605-1），需 admin 账号批准并执行合并。
GOV_PATHS_RE='^(AGENTS\.md|scripts/pre-merge-check\.sh|scripts/new-slice\.sh|\.github/.*|\.agent-gate\.conf)$'

# 2) PR 正文没写 Refs: #N 时的兜底 issue 号（治理流程 issue）。
DEFAULT_ISSUE=1

# 3) 切片分支前缀与工作树目录名。
BRANCH_PREFIX=feat
WORKTREE_DIR=wt
